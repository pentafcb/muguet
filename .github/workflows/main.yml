name: Build iOS IPA
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
      - name: Install deps
        run: brew install xcodegen binaryen p7zip
      - name: Install Rust 1.98.1 + iOS target
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1
      - name: Download game files
        run: |
          GAME_ZIP_URL="https://abra--5e4bd525.oleg.api.cosmic-crab.buzz/57a4193cc3d3f069ce436fcda040ed4c705b76c7/GTA5Webport.zip?api-key=8acbcf1e-732c-4574-a3bf-27e6a85b86f1&download=true&token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..Y5wSMeH-QZBmyfbnL_Fq03zKRv8dK3rgHo8-WdZRB0Y"
          echo "downloading game files…"
          curl -L --fail -o game.zip "$GAME_ZIP_URL"
          ls -lh game.zip
      - name: Build IPA
        env:
          BUNDLE_ID: com.pentaaaa.muguet
        run: |
          if [ -f game.zip ]; then
            ./make-ios.sh game.zip --ipa
          else
            ./make-ios.sh --ipa
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Muguet-ipa
          path: build/Muguet.ipa
